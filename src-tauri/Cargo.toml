[package]
name = "app"
version = "2.1.0"
description = "CodexOS — The Ultimate Offline Developer OS"
authors = ["CodeSorcerer-007"]
license = "MIT"
repository = "https://github.com/CodeSorcerer-007/CodexOS"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
sysinfo = "0.33"
portable-pty = "0.8.1"
tokio = { version = "1.42.0", features = ["full"] }
walkdir = "2.5.0"
trash = "5.2.3"
tauri-plugin-dialog = "2.0.0"
local-ip-address = "0.6.13"
regex = "1.13.1"
rusqlite = { version = "0.29.0", features = ["bundled"] }
zip = "4.2.0"
linemux = "0.3.0"
futures = "0.3.33"
serde_yml = "0.0.12"
quick-xml = "0.39.4"
sha2 = "0.10.9"
md-5 = "0.10.6"
hex = "0.4.3"
oxipng = "9.1.5"
reqwest = { version = "0.13.3", features = ["json", "stream", "blocking"] }
x509-parser = "0.18.1"
rand = "0.8.5"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "postgres", "mysql"] }
wasmtime = "18.0.0"
ring = "0.17"
argon2 = "0.5.3"
chacha20poly1305 = "0.10.1"
zeroize = { version = "1.8.2", features = ["zeroize_derive"] }
thiserror = "2.0"
notify = "7"
hyper = { version = "0.14", features = ["full"] }
hyper-tls = "0.5"
aes-gcm = "0.10"
tiny_http = "0.12"

[dev-dependencies]
proptest = "1.5.0"
tempfile = "3.27.0"
wasmtime-wasi = "18.0.0"

[dependencies.ts-rs]
version = "10.0"
features = ["uuid-impl", "chrono-impl"]
