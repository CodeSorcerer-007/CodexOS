name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Linters & Formatting
        run: npm run lint

      - name: TypeScript Verification
        run: npx tsc -b

      - name: Vitest Unit & Integration Tests
        run: npx vitest run

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Install cargo-audit and cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-tarpaulin

      - name: Cargo fmt Check
        run: cargo fmt --all -- --check
        working-directory: ./src-tauri

      - name: Cargo Clippy
        run: cargo clippy -- -D warnings
        working-directory: ./src-tauri

      - name: Cargo Test
        run: cargo test
        working-directory: ./src-tauri

      - name: Cargo Audit
        run: cargo audit
        working-directory: ./src-tauri

      - name: Cargo Deny (License + Advisory + Bans)
        uses: EmbarkStudios/cargo-deny-action@v1
        with:
          manifest-path: src-tauri/Cargo.toml

      - name: Cargo Tarpaulin (Coverage)
        run: cargo tarpaulin --out Xml
        working-directory: ./src-tauri

  build-matrix:
    needs: [frontend, rust]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux Build Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Install Dependencies
        run: npm ci

      - name: Verify Tauri Build
        run: npm run tauri build -- --debug
