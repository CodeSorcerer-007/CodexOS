version: '3.8'

services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    restart: always

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: codexos
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: codexos_db
    ports:
      - "5432:5432"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
